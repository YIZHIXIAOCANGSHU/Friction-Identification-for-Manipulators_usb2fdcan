# 电机列表。
# - ids: 逻辑电机 id，必须连续递增；结果目录、CSV 和 Rerun 都使用这个编号。
# - names: 仅用于显示和报告，顺序必须和 ids 一一对应。
# - enabled: 本次默认参与实验的电机；命令行 --motors 会覆盖这里。
motors:
  ids: [1, 2, 3, 4, 5, 6, 7]
  names:
    - "motor_01"
    - "motor_02"
    - "motor_03"
    - "motor_04"
    - "motor_05"
    - "motor_06"
    - "motor_07"
  enabled: [1, 2, 3, 4, 5, 6, 7]

# SocketCAN 与达妙驱动映射。
# motor_can_ids 是电机 CAN id，motor_mst_ids 是驱动反馈主站 id。
# motor_types 必须和真实电机一致，否则达妙 MIT 帧的 p/v/t 缩放会错，轻则辨识不准，重则命令过大。
transport:
  interface: "can0"
  nominal_bitrate: 1000000
  data_bitrate: 5000000
  configure_interface: false
  force_fd: true
  read_timeout: 0.02
  read_chunk_size: 256
  flush_input_before_round: true
  sync_timeout: 2.0
  motor_can_ids: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07]
  motor_mst_ids: [0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17]
  motor_types: ["DM8009", "DM8009", "DM4340", "DM4340", "DM4310", "DM4310", "DM4310"]

# 安全保护。
# hard_speed_abort_abs 是硬件安全峰值，保持 10.0 rad/s；不要通过调高它来“解决”辨识或补偿问题。
# moving_velocity_threshold 用于判断是否已经静止，太大可能提前进入下一阶段，太小可能等待超时。
safety:
  hard_speed_abort_abs: 10.0
  moving_velocity_threshold: 0.2
  moving_hold_ms: 50
  post_abort_disable_delay_ms: 80

# 起转/静摩擦扫描。
# torque_step 单位 Nm；越小越细、越慢，越大越快但静摩擦估计更粗。
# hold_duration 单位 s；每个扭矩台阶保持时间，过短可能还没起动就跳到下一档。
# scan_max_torque 按电机给上限，必须低于该型号安全力矩余量。
# 静摩擦补偿不足由低速采集与分段静摩擦模型改善，不通过提高扫描上限处理。
breakaway:
  torque_step: 0.01
  hold_duration: 0.25
  scan_max_torque: [0.80, 0.80, 0.60, 0.60, 0.40, 0.40, 0.40]

# MIT 速度控制参数，用于 speed-hold、inertia 和等待静止。
# kd_speed 可逐电机调节；跟踪慢可小幅调大，振荡或噪声明显则调小。
# ramp_acceleration 单位 rad/s^2；越大实验越快，但惯量阶段更容易激进。
# steady_hold_duration 单位 s；稳态摩擦取平台末段，平台太短会使 RMSE 抖动。
# steady_window_ratio 表示取每个平台末尾多少比例做统计。
mit_velocity:
  kd_speed: [1.0, 1.2, 0.8, 0.8, 0.6, 0.6, 0.6]
  ramp_acceleration: 2.0
  steady_hold_duration: 1.2
  steady_window_ratio: 0.5

# 低速/静摩擦过渡区采集。
# 该阶段不放开 10 rad/s 硬限制，默认最高只到 1 rad/s；低速微动默认速度上限 0.12 rad/s。
# 跟踪失败的平台会作为 stiction_evidence 保留，用于约束静摩擦峰值和分段过渡。
# 20260428 motor_02 多次在 low_speed_micro_train 瞬时超速，微动默认改为只下发 MIT velocity 目标，不下发位置/力矩前馈。
low_speed:
  enabled: true
  speed_points: [0.03, 0.05, 0.08, 0.12, 0.20, 0.35, 0.50, 0.75, 1.00]
  ramp_acceleration: 0.5
  hold_duration: 1.0
  micro_motion_enabled: true
  micro_motion_velocity_limit: 0.12
  micro_motion_frequency_hz: 0.5
  micro_motion_kp: 0.0
  micro_motion_kd: 0.25
  micro_motion_record_duration: 6.0
  train_valid_split: 0.7

# 惯量阶段速度 waypoint，单位 rad/s，必须从 0 开始并回到 0。
# 这里的峰值也必须低于 hard_speed_abort_abs=10.0；需要更温和时优先降低 waypoint，而不是提高硬限。
inertia:
  waypoints: [0.0, 2.0, 4.0, 6.0, 4.0, 2.0, 0.0, -2.0, -4.0, -6.0, -4.0, -2.0, 0.0]

# dynamic MIT 位置/速度轨迹采集。
# 默认接入 identify-all，作为 joint_static_dynamic_v1 的数据来源之一，不单独替代 speed-hold/inertia。
# velocity_limit 必须明显低于 10 rad/s 硬峰值；如果跟踪差，先降低幅值/频率/速度上限。
# 20260428 motor_02 在带位置环 dynamic-mit 中多次触发硬保护；默认改为速度型小激励，kp 保持 0。
dynamic_mit:
  enabled: true
  trajectory_type: "sine"          # sine / chirp / trapezoid_velocity
  position_amplitude: 0.20         # rad，现场先从小幅值开始
  velocity_limit: 1.0              # rad/s，运行时软限速，必须小于 safety.hard_speed_abort_abs
  frequency_hz: 0.20               # sine 使用
  frequency_range_hz: [0.1, 1.0]   # chirp 使用
  cycle_count: 3                   # trapezoid_velocity 使用
  warmup_duration: 1.0
  record_duration: 8.0
  kp: 0.0
  kd: 0.25
  train_valid_split: 0.7
  max_position_error: 0.3
  max_velocity_error: 1.0
  saturation_torque_ratio: 0.95
  use_mit_estimated_torque: false  # 默认只把 tau_mit_est 当诊断量
  use_for_publish: false           # 保留兼容字段；identify-all 使用 joint fit，不再用 dynamic MIT 直接替代
  min_fit_sample_count: 50

# 辨识和发布阈值。
# steady_speed_points 单位 rad/s。20260427 数据显示 motor_03/04 在 8 rad/s 跟踪约 0.70，
# 因此默认最高验证点改为 6 rad/s；10 rad/s 硬峰值仍保持不变。
# joint_*_weight 是联合拟合权重：speed-hold 稳定摩擦项，inertia/dynamic_mit 补充动态激励。
# RMSE 阈值越严格，越不容易覆盖 latest_motor_parameters.json。
identification:
  steady_speed_points: [0.5, 1.0, 2.0, 4.0, 6.0]
  repeat_count: 3
  generation_safety_margin_ratio: 0.80
  phase_quality_retry_count: 1
  min_low_speed_fit_samples_per_direction: 8
  savgol_window: 21
  savgol_polyorder: 3
  inertia_savgol_window_candidates: [21, 31, 41, 61, 81]
  joint_speed_hold_weight: 3.0
  joint_inertia_weight: 1.0
  joint_dynamic_mit_weight: 0.5
  min_joint_fit_sample_count: 20
  min_platform_sample_count: 3
  min_tracking_ratio: 0.75
  max_steady_velocity_std_ratio: 0.15
  min_publishable_rounds: 2
  friction_rmse_publish_threshold: 0.15
  inertia_rmse_publish_threshold: 0.20

# 在线补偿限制。默认只允许 published 模型参与补偿。
# 20260427 motor_01 compensation 在 8.56 rad/s 触发 soft abort；这里通过降低补偿比例和斜率抑制激进命令，
# 不通过提高 10 rad/s 硬峰值来规避问题。
compensation:
  require_published_model: true
  torque_limit_ratio: 0.25
  torque_slew_rate_nm_s: 2.0
  static_velocity_threshold_rad_s: 0.20
  static_transition_velocity_rad_s: 0.50
  soft_abort_start_ratio: 0.60
  soft_abort_stop_ratio: 0.85
  max_inertia_torque_ratio: 0.25
  direction_hold_samples: 3

# 输出文件名和结果根目录。
output:
  results_dir: "results"
  summary_filename: "hardware_identification_summary.npz"
  summary_csv_filename: "hardware_identification_summary.csv"
  summary_report_filename: "hardware_identification_summary.md"
  latest_parameters_json_filename: "latest_motor_parameters.json"
