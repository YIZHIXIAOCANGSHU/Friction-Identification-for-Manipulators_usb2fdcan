[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mit-sender"
version = "0.1.0"
description = "PySide6 MIT motor command sender for Damiao motors over SocketCAN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<6.12",
    "rerun-sdk>=0.27",
]

[project.scripts]
mit-sender = "mit_sender.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mit_sender = ["py.typed"]
